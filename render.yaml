# Render "Blueprint": creates the web service AND the database in one go.
# In Render, choose New > Blueprint and point it at your GitHub repo.
services:
  - type: web
    name: link-shortener
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true          # Render invents a strong secret for you
      - key: BASE_URL
        sync: false                  # paste your live URL here after the first deploy
      - key: DATABASE_URL
        fromDatabase:
          name: link-shortener-db
          property: connectionString

databases:
  - name: link-shortener-db
    plan: free
