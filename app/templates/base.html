<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Shortly{% endblock %} · Shortly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🔗</text></svg>">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">⌘</span> Shortly</a>
    {% if user %}
      <nav>
        <span class="who">{{ user.email }}</span>
        <form method="post" action="/logout">
          <button class="btn-ghost" type="submit">Log out</button>
        </form>
      </nav>
    {% endif %}
  </header>

  <main>
    {% if flash %}
      <p class="banner {{ flash.kind }}">{{ flash.message }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer>Built with FastAPI · <a href="/docs">API docs</a></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
