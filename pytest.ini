[pytest]
# Adds the project root to Python's import path so the tests can do
# "from app.main import app".
#
# Without this, only "python -m pytest" works: that form puts the current
# directory on the import path, while a bare "pytest" does not. CI runs the
# bare form, so leaving this out means tests that pass locally fail on
# GitHub with "No module named 'app'".
#
# This lives in pytest.ini rather than pyproject.toml on purpose: Vercel
# treats the presence of a pyproject.toml as "this is a uv project" and its
# build fails with "No `project` table found".
pythonpath = .
testpaths = tests
